name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SongStash.sln
      - run: dotnet build SongStash.sln --configuration Release --no-restore
      - run: dotnet test SongStash.sln --configuration Release --no-build
